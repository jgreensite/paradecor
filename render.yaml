services:
  # Backend Web Service
  - type: web
    name: rybform-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web # Updated to match the frontend's new type
          name: rybform-frontend
          envVarKey: RENDER_EXTERNAL_URL # Pulls the actual URL

  # Frontend Static Site
  - type: web # Changed from 'static'
    env: static # Defines the runtime as a static site
    name: rybform-frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        fromService:
          type: web
          name: rybform-backend
          envVarKey: RENDER_EXTERNAL_URL # Pulls the actual URL
