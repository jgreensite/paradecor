# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  # Backend Web Service
  - type: web
    name: rybform-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    previews:
      generation: automatic
    buildFilter:
      paths:
        - .repo-integrations.json
        - render.yaml
        - server/**
        - package.json
        - package-lock.json
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # Updated to match preferred standard
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: rybform-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend Static Site
  - type: web
    name: rybform-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    previews:
      generation: automatic
    buildFilter:
      paths:
        - .repo-integrations.json
        - render.yaml
        - src/**
        - public/**
        - index.html
        - package.json
        - package-lock.json
        - tsconfig.json
        - vite.config.ts
      ignoredPaths:
        - src/**/*.test.ts
        - src/**/*.test.tsx
        - server/**
        - docs/**
        - README.md
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.clerk.accounts.dev https://*.clerk.dev https://clerk.rybform.com https://js.stripe.com; connect-src 'self' https://*.supabase.co https://*.clerk.accounts.dev https://*.clerk.dev https://clerk.rybform.com https://api.stripe.com wss://*.clerk.dev; worker-src 'self' blob:; img-src 'self' data: blob: https://*.stripe.com https://img.clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://js.stripe.com; object-src 'none';"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        fromService:
          type: web
          name: rybform-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
