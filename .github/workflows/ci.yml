name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install server dependencies
      run: npm ci
      working-directory: server

    - name: Build
      run: npm run build

    - name: Dependency Cruise
      run: npx depcruise src --output-type err-long

    - name: Run Tests with Coverage
      run: |
        npx vitest run --coverage
        # Optional: Fail build if coverage is below threshold
        # (This is already configured in vitest.config.ts / package.json if using --coverage)

    - name: Run server tests
      run: npm test
      working-directory: server
